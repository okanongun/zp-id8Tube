# Publishes this repository's MGU Store catalog (the GitHub release tagged "catalog": what the Store reads for
# waliworld/iDrive8-RideTube, Releases) from main. Every component whose version did not change since the kept
# release "stable-1" (the first version confirmed on a car) is taken from there as it is (tools/channel.py pin),
# so the service a car runs stays the very package that was confirmed until its version changes.
# Kept for going back, and never rebuilt by this workflow: the releases "stable-1" (Beta 1), "beta2" (Beta 2),
# "beta3" (Beta 3) and "beta4" (Beta 4, copied from the main release by the run that first replaces it), the
# branches beta1-stable, beta2, beta3 and beta4.
# Runs when main changes in what goes into the release, or by hand (Actions, Run workflow).
name: Release (MGU Store catalog)

on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'kit/**'
      - 'native/jap-ridetube-d/**'
      - 'native/ytaud/**'
      - 'tools/**'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: catalog-release
  cancel-in-progress: false

env:
  KEPT_CATALOG: https://github.com/waliworld/iDrive8-RideTube/releases/download/stable-1/catalog.json

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Keep Beta 4 as the release "beta4" before it is replaced (once)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          base=https://github.com/waliworld/iDrive8-RideTube/releases/download
          if curl -fsSL -o /dev/null "$base/beta4/catalog.json"; then echo "beta4 is kept already"; exit 0; fi
          # (the main release is Beta 4 until this run publishes: app 0.7.0 with the service of stable-1)
          if python3 tools/channel.py freeze "$base/catalog/catalog.json" beta4 "$RUNNER_TEMP/beta4" \
               --expect jap_ridetube8=0.7.0 --expect jap-ridetube-d=0.5.2; then
            gh release view beta4 >/dev/null 2>&1 || gh release create beta4 --target 7e392d38df17d33ac258b87c3086eae36ce30553 --latest=false \
              --title "BeeMTube2 for iDrive 8 - Beta 4 (kept for going back)" \
              --notes "Beta 4 as it was the main release: app 0.7.0, service 0.5.2. A copy for keeping, never rebuilt. To go back to it, add the address of this release's catalog.json as a source in the MGU Store, uninstall the app and the RideTube service and install them again from there."
            gh release upload beta4 "$RUNNER_TEMP"/beta4/* --clobber
            echo "kept:"; ls -l "$RUNNER_TEMP/beta4"
          else
            echo "::warning::the main release is not Beta 4 any more: nothing kept as beta4"
          fi

      - name: Test tools (ffmpeg and jpegtran make the tests' media; gcc with the static libc builds ytaud)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg libjpeg-turbo-progs file gcc libc6-dev git

      - name: The MGU Store (its deploy/hu packs the tool kits)
        run: git clone --depth 1 https://github.com/robertnisipeanu/mgu-store "$RUNNER_TEMP/mgu-store"

      - name: Build the release (dist/release/)
        run: MGU_STORE="$RUNNER_TEMP/mgu-store" RELEASE_TAG=catalog tools/release_id8.sh

      - name: What did not change since stable-1 is its own package
        run: python3 tools/channel.py pin dist/release "$KEPT_CATALOG"

      - name: Publish it as the release "catalog"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="BeeMTube2 for iDrive 8 - Beta 5 (MGU Store catalog, the main release)"
          notes="The MGU Store reads catalog.json here. In the Store: Settings, Add source, \`waliworld/iDrive8-RideTube\`, Releases. Then install BeeMTube2 and restart the head unit. Rebuilt by the Release workflow on every change to main. Older versions of the packages stay attached below. To go back: Beta 4 is the release \`beta4\`, Beta 3 the release \`beta3\`, Beta 2 the release \`beta2\`, Beta 1 (stable) the release \`stable-1\` - add the address of its catalog.json as a source, uninstall the app and the RideTube service, install them again from there. Based on RideTube by JustAnotherPU."
          if gh release view catalog >/dev/null 2>&1; then
            gh release edit catalog --title "$title" --notes "$notes" --latest
          else
            gh release create catalog --target "$GITHUB_SHA" --title "$title" --notes "$notes" --latest
          fi
          gh release upload catalog dist/release/* --clobber
          echo "published:"; ls -l dist/release
