# The release channels of this repository's MGU Store catalog (tools/channel.py):
#   main   -> the GitHub release tagged "catalog": the stable channel, what the Store reads for
#             waliworld/iDrive8-RideTube (Releases)
#   beta2  -> the release tagged "beta2": new work, added on a car by the address of its catalog.json; what did not
#             change since stable is the stable channel's own package
# A run on beta2 also keeps the first version confirmed with sound and picture on a car as the release "stable-1"
# (a copy of the stable catalog and its packages at that moment, made once and never rebuilt).
# Runs when one of the two branches changes in what goes into the release, or by hand (Actions, Run workflow).
name: Release (MGU Store catalog)

on:
  push:
    branches: [main, beta2]
    paths:
      - 'apps/**'
      - 'kit/**'
      - 'native/jap-ridetube-d/**'
      - 'native/ytaud/**'
      - 'tools/**'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: catalog-release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  STABLE_CATALOG: https://github.com/waliworld/iDrive8-RideTube/releases/download/catalog/catalog.json
  # the commit of main the stable channel was confirmed at (app 0.4.6, service 0.5.2)
  STABLE_1_COMMIT: cb89fd43365c27ce31e7d9fa3fdb591a21abb3a7

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: The channel of this branch
        run: |
          case "$GITHUB_REF_NAME" in
            main) echo "RELEASE_TAG=catalog" >> "$GITHUB_ENV" ;;
            beta2) echo "RELEASE_TAG=beta2" >> "$GITHUB_ENV" ;;
            *) echo "no release channel for the branch $GITHUB_REF_NAME" >&2; exit 1 ;;
          esac

      - name: Keep the confirmed stable version as the release "stable-1" (once)
        if: github.ref_name == 'beta2'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view stable-1 >/dev/null 2>&1; then echo "stable-1 is kept already"; exit 0; fi
          python3 tools/channel.py freeze "$STABLE_CATALOG" stable-1 "$RUNNER_TEMP/stable-1" \
            --expect jap_ridetube8=0.4.6 --expect jap-ridetube-d=0.5.2
          gh release create stable-1 --target "$STABLE_1_COMMIT" \
            --title "RideTube for iDrive 8 - Stable 1 (sound and picture confirmed)" \
            --notes "The first version confirmed with sound and picture on an iDrive 8 car (G8x): app 0.4.6, service 0.5.2. A copy for keeping, never rebuilt. To go back to exactly this version, add the address of this release's catalog.json as a source in the MGU Store."
          gh release upload stable-1 "$RUNNER_TEMP"/stable-1/*
          echo "kept:"; ls -l "$RUNNER_TEMP/stable-1"

      - name: Test tools (ffmpeg and jpegtran make the tests' media; gcc with the static libc builds ytaud)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg libjpeg-turbo-progs file gcc libc6-dev git

      - name: The MGU Store (its deploy/hu packs the tool kits)
        run: git clone --depth 1 https://github.com/robertnisipeanu/mgu-store "$RUNNER_TEMP/mgu-store"

      - name: Build the release (dist/release/)
        run: MGU_STORE="$RUNNER_TEMP/mgu-store" tools/release_id8.sh

      - name: "Beta: what did not change is the stable channel's own package"
        if: github.ref_name == 'beta2'
        run: python3 tools/channel.py pin dist/release "$STABLE_CATALOG"

      - name: Publish it as the release of the channel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            if [ "$RELEASE_TAG" = catalog ]; then
              gh release create catalog --target "$GITHUB_SHA" \
                --title "MGU Store catalog (RideTube for iDrive 8, stable)" \
                --notes "The MGU Store reads catalog.json here. In the Store: Settings, Add source, \`waliworld/iDrive8-RideTube\`, Releases. Then install RideTube and restart the head unit. Rebuilt by the Release workflow on every change to main."
            else
              gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --prerelease \
                --title "RideTube for iDrive 8 - Beta 2 (new work; stable stays in the catalog release)" \
                --notes "New work on top of the stable version. In the MGU Store: Settings, Add source, the address of this release's catalog.json. Rebuilt by the Release workflow on every change to the branch beta2. To go back: remove this source, uninstall RideTube, install it again from waliworld/iDrive8-RideTube."
            fi
          fi
          gh release upload "$RELEASE_TAG" dist/release/* --clobber
          echo "published:"; ls -l dist/release
