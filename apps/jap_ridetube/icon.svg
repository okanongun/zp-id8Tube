<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- BeeMTube2 (Waliworld #tunedbywali): an original drawing of a grey sports coupe, front on, under studio light. -->
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.3" r="0.85">
      <stop offset="0" stop-color="#3a4252"/><stop offset="0.55" stop-color="#171a21"/><stop offset="1" stop-color="#07080b"/>
    </radialGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#232832"/><stop offset="1" stop-color="#090a0d"/>
    </linearGradient>
    <linearGradient id="paint" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#aab1bd"/><stop offset="0.28" stop-color="#7f8691"/><stop offset="0.6" stop-color="#555b66"/><stop offset="1" stop-color="#2a2e36"/>
    </linearGradient>
    <linearGradient id="hood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9cfd9"/><stop offset="1" stop-color="#7b828d"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a909b"/><stop offset="1" stop-color="#5a606b"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a475e"/><stop offset="0.45" stop-color="#141a26"/><stop offset="1" stop-color="#06080d"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/><stop offset="0.5" stop-color="#ffffff" stop-opacity="0.55"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="mesh" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="7" height="7" fill="#07080b"/><path d="M0 0 H7 M0 0 V7" stroke="#2b3038" stroke-width="1.5"/>
    </pattern>
    <pattern id="carbon" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="#0f1114"/><path d="M0 6 L6 0" stroke="#262a31" stroke-width="2"/>
    </pattern>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.2"/></filter>
    <filter id="glow" x="-60%" y="-200%" width="220%" height="500%"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="shadow" x="-20%" y="-100%" width="140%" height="300%"><feGaussianBlur stdDeviation="5"/></filter>
    <clipPath id="tile"><rect x="8" y="8" width="240" height="240" rx="54"/></clipPath>
    <clipPath id="body"><path id="bodyp" d="M30 172 C27 152 33 140 46 133 C60 126 70 120 80 117 L93 95 Q128 84 163 95 L176 117 C186 120 196 126 210 133 C223 140 229 152 226 172 L226 186 Q226 194 216 194 L40 194 Q30 194 30 186 Z"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect x="8" y="8" width="240" height="240" fill="url(#bg)"/>
    <rect x="8" y="190" width="240" height="58" fill="url(#floor)"/>
    <ellipse cx="128" cy="40" rx="110" ry="40" fill="#ffffff" fill-opacity="0.07" filter="url(#shadow)"/>
  </g>
  <g transform="translate(128 150) scale(1.13) translate(-128 -158)">
  <g clip-path="url(#tile)">
    <!-- the car's light on the floor -->
    <ellipse cx="128" cy="212" rx="86" ry="9" fill="#5fd8ff" fill-opacity="0.12" filter="url(#shadow)"/>
    <ellipse cx="128" cy="199" rx="104" ry="7" fill="#000000" fill-opacity="0.85" filter="url(#shadow)"/>
  </g>
  <!-- tyres -->
  <rect x="33" y="180" width="30" height="24" rx="6" fill="#0b0c0f"/>
  <rect x="193" y="180" width="30" height="24" rx="6" fill="#0b0c0f"/>
  <!-- mirrors -->
  <path d="M78 113 L60 107 Q55 107 55 112 L57 117 L77 120 Z" fill="#5b616c"/>
  <path d="M178 113 L196 107 Q201 107 201 112 L199 117 L179 120 Z" fill="#5b616c"/>
  <!-- body -->
  <use href="#bodyp" fill="url(#paint)"/>
  <g clip-path="url(#body)">
    <!-- roof and glass -->
    <path d="M93 95 Q128 84 163 95 L176 118 L80 118 Z" fill="url(#roof)"/>
    <path d="M97 99 Q128 90 159 99 L170 118 Q128 111 86 118 Z" fill="url(#glass)"/>
    <path d="M104 97 L120 94 L106 116 L92 117 Z" fill="#ffffff" fill-opacity="0.16"/>
    <path d="M126 93 L132 93 L120 114 L114 114 Z" fill="#ffffff" fill-opacity="0.10"/>
    <!-- hood: lit from above, a soft crease each side -->
    <path d="M82 119 Q128 111 174 119 L200 141 Q128 131 56 141 Z" fill="url(#hood)"/>
    <path d="M110 116 L101 137 M146 116 L155 137" stroke="#4b515b" stroke-width="1.4" fill="none" stroke-opacity="0.8"/>
    <rect x="70" y="121" width="116" height="5" fill="url(#sheen)" filter="url(#soft)"/>
    <!-- shoulders catch the light -->
    <path d="M38 146 C44 138 54 133 66 129" stroke="#ffffff" stroke-opacity="0.55" stroke-width="3" fill="none" stroke-linecap="round" filter="url(#soft)"/>
    <path d="M218 146 C212 138 202 133 190 129" stroke="#ffffff" stroke-opacity="0.55" stroke-width="3" fill="none" stroke-linecap="round" filter="url(#soft)"/>
    <!-- the nose in shade -->
    <path d="M28 160 Q128 170 228 160 L228 196 L28 196 Z" fill="#14161b" fill-opacity="0.45"/>
  </g>
  <!-- lights: slim housings, a lit blade in each -->
  <path d="M42 144 Q66 139 94 147 L90 156 Q64 153 45 154 Z" fill="#090a0d"/>
  <path d="M214 144 Q190 139 162 147 L166 156 Q192 153 211 154 Z" fill="#090a0d"/>
  <g fill="none" stroke-linecap="round">
    <path d="M49 148 Q68 144 87 149.5 M207 148 Q188 144 169 149.5" stroke="#49cfff" stroke-width="6" filter="url(#glow)"/>
    <path d="M49 148 Q68 144 87 149.5 M207 148 Q188 144 169 149.5" stroke="#e9fbff" stroke-width="2.4"/>
  </g>
  <!-- intakes: a mesh centre, a blade each side -->
  <path d="M99 151 L157 151 L164 167 L151 182 L105 182 L92 167 Z" fill="url(#mesh)" stroke="#3a3f48" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M38 165 L84 167 L90 181 L45 183 Z" fill="#07080b" stroke="#30343c" stroke-width="1.2" stroke-linejoin="round"/>
  <path d="M218 165 L172 167 L166 181 L211 183 Z" fill="#07080b" stroke="#30343c" stroke-width="1.2" stroke-linejoin="round"/>
  <path d="M44 174 L86 175 M212 174 L170 175" stroke="#3b4048" stroke-width="1.6"/>
  <!-- the splitter -->
  <path d="M34 189 L222 189 L231 197 L25 197 Z" fill="url(#carbon)" stroke="#0a0b0d" stroke-width="1"/>
  <path d="M34 189 L222 189" stroke="#4a505a" stroke-width="1"/>
  <circle cx="40" cy="193" r="2" fill="#ff8a1f"/><circle cx="216" cy="193" r="2" fill="#ff8a1f"/>
  </g>
  <rect x="9.5" y="9.5" width="237" height="237" rx="52.5" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="3"/>
</svg>
