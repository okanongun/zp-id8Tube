<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- RideTube for iDrive 8 (Waliworld #tunedbywali): a rev counter running into its red zone around a play mark. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1e26"/>
      <stop offset="1" stop-color="#07080b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.52" r="0.42">
      <stop offset="0" stop-color="#ff8a1f" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#ff8a1f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="play" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffc233"/>
      <stop offset="1" stop-color="#ff5a2a"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#aab4c4"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="54" fill="url(#tile)"/>
  <rect x="9.5" y="9.5" width="237" height="237" rx="52.5" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="3"/>
  <rect x="8" y="8" width="240" height="240" rx="54" fill="url(#glow)"/>
  <!-- the rev counter: 270 degrees, the last 60 red -->
  <path d="M70.02 191.98 A82 82 0 1 1 204.03 103.28" fill="none" stroke="url(#ring)" stroke-width="13" stroke-linecap="round"/>
  <path d="M209.20 122.59 A82 82 0 0 1 185.98 191.98" fill="none" stroke="#ff3b30" stroke-width="13" stroke-linecap="round"/>
  <g>
    <line x1="84.16" y1="177.84" x2="78.50" y2="183.50" stroke="#8f98a8" stroke-width="5" stroke-linecap="round"/>
    <line x1="68.11" y1="150.05" x2="60.39" y2="152.12" stroke="#8f98a8" stroke-width="5" stroke-linecap="round"/>
    <line x1="68.11" y1="117.95" x2="60.39" y2="115.88" stroke="#8f98a8" stroke-width="5" stroke-linecap="round"/>
    <line x1="84.16" y1="90.16" x2="78.50" y2="84.50" stroke="#8f98a8" stroke-width="5" stroke-linecap="round"/>
    <line x1="111.95" y1="74.11" x2="109.88" y2="66.39" stroke="#8f98a8" stroke-width="5" stroke-linecap="round"/>
    <line x1="144.05" y1="74.11" x2="146.12" y2="66.39" stroke="#8f98a8" stroke-width="5" stroke-linecap="round"/>
    <line x1="171.84" y1="90.16" x2="177.50" y2="84.50" stroke="#8f98a8" stroke-width="5" stroke-linecap="round"/>
    <line x1="187.89" y1="117.95" x2="195.61" y2="115.88" stroke="#ff4a3d" stroke-width="5" stroke-linecap="round"/>
    <line x1="187.89" y1="150.05" x2="195.61" y2="152.12" stroke="#ff4a3d" stroke-width="5" stroke-linecap="round"/>
    <line x1="171.84" y1="177.84" x2="177.50" y2="183.50" stroke="#ff4a3d" stroke-width="5" stroke-linecap="round"/>
  </g>
  <!-- the play mark -->
  <path d="M110 104 L110 164 L162 134 Z" fill="url(#play)" stroke="url(#play)" stroke-width="12" stroke-linejoin="round"/>
</svg>
